<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quán Cà Phê Nhà Mình</title>
  </head>
  <body>
    <main id="lobby">
      <p class="eyebrow">M2 · Căn quán 3D</p>
      <h1>Quán Cà Phê Nhà Mình</h1>
      <p>Chào mừng bạn đến căn quán nhỏ của chúng ta.</p>
      <form id="join-form">
        <label>
          Tên của bạn
          <input id="name" maxlength="16" value="Bạn cà phê" required />
        </label>
        <label>
          Mã phòng
          <input id="room" maxlength="24" pattern="[a-z0-9-]+" value="phong-nho" required />
        </label>
        <label>
          PIN chủ quán (tùy chọn)
          <input id="admin-pin" type="password" maxlength="32" autocomplete="off" placeholder="Đặt PIN lần đầu vào phòng" />
        </label>
        <button type="submit">Vào quán</button>
      </form>
      <p id="status" role="status">Chưa kết nối</p>
      <p id="count">Trong phòng: 0 người</p>
    </main>
    <section id="game" aria-label="Không gian quán cà phê">
      <div id="game-hud">
        <strong>Quán Cà Phê Nhà Mình</strong>
        <span>WASD / phím mũi tên để di chuyển</span>
      </div>
      <div id="joystick" aria-label="Cần điều khiển di động">
        <div id="joystick-stick"></div>
      </div>
      <button id="action-button" type="button">Tương tác</button>
      <form id="chat-form">
        <input id="chat-input" maxlength="60" placeholder="Nói gì đó…" aria-label="Tin nhắn" />
        <button type="submit">Gửi</button>
      </form>
      <form id="brew-form">
        <strong>Pha món tự do</strong>
        <input id="drink-name" maxlength="32" placeholder="Tên món mới" required />
        <input id="drink-note" maxlength="120" placeholder="Ghi chú cho khách" />
        <div id="ingredient-list"></div>
        <button type="submit">Pha đồ uống</button>
        <button id="serve-button" type="button">Phục vụ khách gần nhất</button>
      </form>
      <div id="admin-panel" hidden>
        <strong>Phân công pha chế</strong>
        <select id="brewer-player"></select>
        <button id="toggle-brewer" type="button">Cho phép pha</button>
      </div>
      <button id="leave-game" type="button">Rời quán</button>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
